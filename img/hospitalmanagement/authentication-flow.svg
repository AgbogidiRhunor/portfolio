<svg viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" font-family="SF Mono, ui-monospace, monospace">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8b5cf6"/>
    </marker>
  </defs>
  <rect width="1000" height="420" fill="#0c0c0e"/>

  <g>
    <rect x="20" y="170" width="140" height="70" rx="12" fill="#1c1c1e" stroke="#2e2e30"/>
    <text x="90" y="200" fill="#fff" font-size="13" text-anchor="middle" font-weight="bold">Client</text>
    <text x="90" y="220" fill="#86868b" font-size="10" text-anchor="middle">POST /login</text>
  </g>

  <g>
    <rect x="220" y="170" width="160" height="70" rx="12" fill="#1c1c1e" stroke="#2e2e30"/>
    <text x="300" y="196" fill="#fff" font-size="13" text-anchor="middle" font-weight="bold">Auth Middleware</text>
    <text x="300" y="216" fill="#86868b" font-size="10" text-anchor="middle">validates credentials</text>
  </g>

  <g>
    <rect x="440" y="170" width="160" height="70" rx="12" fill="#1c1c1e" stroke="#2e2e30"/>
    <text x="520" y="196" fill="#fff" font-size="13" text-anchor="middle" font-weight="bold">JWT Service</text>
    <text x="520" y="216" fill="#86868b" font-size="10" text-anchor="middle">issues access + refresh</text>
  </g>

  <g>
    <rect x="660" y="170" width="160" height="70" rx="12" fill="#1c1c1e" stroke="#2e2e30"/>
    <text x="740" y="196" fill="#fff" font-size="13" text-anchor="middle" font-weight="bold">Role Resolver</text>
    <text x="740" y="216" fill="#86868b" font-size="10" text-anchor="middle">attaches role claims</text>
  </g>

  <g>
    <rect x="860" y="170" width="120" height="70" rx="12" fill="url(#g1)"/>
    <text x="920" y="200" fill="#fff" font-size="13" text-anchor="middle" font-weight="bold">Dashboard</text>
    <text x="920" y="218" fill="#e8e8ed" font-size="9" text-anchor="middle">role-scoped</text>
  </g>

  <g stroke="#8b5cf6" stroke-width="1.8" marker-end="url(#arrow)">
    <line x1="160" y1="205" x2="216" y2="205"/>
    <line x1="380" y1="205" x2="436" y2="205"/>
    <line x1="600" y1="205" x2="656" y2="205"/>
    <line x1="820" y1="205" x2="856" y2="205"/>
  </g>

  <text x="500" y="60" fill="#98989d" font-size="12" text-anchor="middle">Every subsequent request presents the access token; expired tokens trigger a refresh-token exchange before retry.</text>

  <g>
    <rect x="220" y="300" width="160" height="60" rx="12" fill="#1c1c1e" stroke="#2e2e30"/>
    <text x="300" y="326" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">401 Unauthorized</text>
    <text x="300" y="344" fill="#86868b" font-size="9" text-anchor="middle">invalid / expired token</text>
  </g>
  <line x1="300" y1="240" x2="300" y2="296" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
</svg>
