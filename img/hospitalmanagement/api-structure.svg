<svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg" font-family="SF Mono, ui-monospace, monospace">
  <rect width="1000" height="460" fill="#0c0c0e"/>
  <g>
    <rect x="380" y="20" width="240" height="55" rx="12" fill="#1c1c1e" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="500" y="53" fill="#fff" font-size="13" text-anchor="middle" font-weight="bold">/api/v1/  (DRF Router)</text>
  </g>

  <!-- branches -->
  <g stroke="#3a3a3c" stroke-width="1.3" fill="none">
    <path d="M500,75 L120,120"/>
    <path d="M500,75 L300,120"/>
    <path d="M500,75 L500,120"/>
    <path d="M500,75 L700,120"/>
    <path d="M500,75 L880,120"/>
  </g>

  <g font-size="11">
    <g>
      <rect x="30" y="120" width="180" height="90" rx="10" fill="#1c1c1e" stroke="#2e2e30"/>
      <text x="120" y="140" fill="#a78bfa" text-anchor="middle" font-weight="bold">/auth/</text>
      <text x="42" y="160" fill="#86868b">POST /login</text>
      <text x="42" y="176" fill="#86868b">POST /refresh</text>
      <text x="42" y="192" fill="#86868b">POST /logout</text>
    </g>
    <g>
      <rect x="220" y="120" width="180" height="90" rx="10" fill="#1c1c1e" stroke="#2e2e30"/>
      <text x="310" y="140" fill="#a78bfa" text-anchor="middle" font-weight="bold">/patients/</text>
      <text x="232" y="160" fill="#86868b">GET /patients/{id}</text>
      <text x="232" y="176" fill="#86868b">POST /patients/</text>
      <text x="232" y="192" fill="#86868b">PATCH /patients/{id}</text>
    </g>
    <g>
      <rect x="410" y="120" width="180" height="90" rx="10" fill="#1c1c1e" stroke="#2e2e30"/>
      <text x="500" y="140" fill="#a78bfa" text-anchor="middle" font-weight="bold">/appointments/</text>
      <text x="422" y="160" fill="#86868b">GET /appointments/</text>
      <text x="422" y="176" fill="#86868b">POST /appointments/</text>
      <text x="422" y="192" fill="#86868b">PATCH /{id}/status</text>
    </g>
    <g>
      <rect x="610" y="120" width="180" height="90" rx="10" fill="#1c1c1e" stroke="#2e2e30"/>
      <text x="700" y="140" fill="#a78bfa" text-anchor="middle" font-weight="bold">/prescriptions/</text>
      <text x="622" y="160" fill="#86868b">GET /prescriptions/</text>
      <text x="622" y="176" fill="#86868b">POST /prescriptions/</text>
      <text x="622" y="192" fill="#86868b">PATCH /{id}/dispense</text>
    </g>
    <g>
      <rect x="800" y="120" width="180" height="90" rx="10" fill="#1c1c1e" stroke="#2e2e30"/>
      <text x="890" y="140" fill="#a78bfa" text-anchor="middle" font-weight="bold">/billing/</text>
      <text x="812" y="160" fill="#86868b">GET /invoices/</text>
      <text x="812" y="176" fill="#86868b">POST /invoices/</text>
      <text x="812" y="192" fill="#86868b">POST /payments/</text>
    </g>
  </g>

  <g>
    <rect x="220" y="260" width="180" height="90" rx="10" fill="#1c1c1e" stroke="#2e2e30"/>
    <text x="310" y="280" fill="#a78bfa" font-size="11" text-anchor="middle" font-weight="bold">/lab-requests/</text>
    <text x="232" y="300" fill="#86868b" font-size="11">GET /lab-requests/</text>
    <text x="232" y="316" fill="#86868b" font-size="11">POST /lab-requests/</text>
    <text x="232" y="332" fill="#86868b" font-size="11">POST /{id}/results</text>
  </g>
  <g>
    <rect x="410" y="260" width="180" height="90" rx="10" fill="#1c1c1e" stroke="#2e2e30"/>
    <text x="500" y="280" fill="#a78bfa" font-size="11" text-anchor="middle" font-weight="bold">/users/</text>
    <text x="422" y="300" fill="#86868b" font-size="11">GET /users/me</text>
    <text x="422" y="316" fill="#86868b" font-size="11">PATCH /users/me</text>
    <text x="422" y="332" fill="#86868b" font-size="11">GET /users/ (admin)</text>
  </g>

  <text x="500" y="410" fill="#98989d" font-size="12" text-anchor="middle">Each namespace maps to a service-layer module; permission classes gate access per role before the view executes.</text>
</svg>
