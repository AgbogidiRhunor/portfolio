<svg viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" font-family="SF Mono, ui-monospace, monospace">
  <defs>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6366f1"/>
    </marker>
  </defs>
  <rect width="1000" height="300" fill="#0c0c0e"/>
  <g font-size="12">
    <g>
      <rect x="20" y="110" width="180" height="70" rx="12" fill="#1c1c1e" stroke="#2e2e30"/>
      <text x="110" y="140" fill="#fff" text-anchor="middle" font-weight="bold">Doctor</text>
      <text x="110" y="160" fill="#86868b" font-size="10" text-anchor="middle">creates prescription</text>
    </g>
    <g>
      <rect x="240" y="110" width="180" height="70" rx="12" fill="#1c1c1e" stroke="#2e2e30"/>
      <text x="330" y="140" fill="#fff" text-anchor="middle" font-weight="bold">Validation</text>
      <text x="330" y="160" fill="#86868b" font-size="10" text-anchor="middle">interaction / dosage check</text>
    </g>
    <g>
      <rect x="460" y="110" width="180" height="70" rx="12" fill="#1c1c1e" stroke="#2e2e30"/>
      <text x="550" y="140" fill="#fff" text-anchor="middle" font-weight="bold">Pharmacist</text>
      <text x="550" y="160" fill="#86868b" font-size="10" text-anchor="middle">reviews and dispenses</text>
    </g>
    <g>
      <rect x="680" y="110" width="150" height="70" rx="12" fill="#1c1c1e" stroke="#2e2e30"/>
      <text x="755" y="140" fill="#fff" text-anchor="middle" font-weight="bold">Inventory</text>
      <text x="755" y="160" fill="#86868b" font-size="10" text-anchor="middle">stock decremented</text>
    </g>
    <g>
      <rect x="860" y="110" width="120" height="70" rx="12" fill="#6366f1"/>
      <text x="920" y="140" fill="#fff" text-anchor="middle" font-weight="bold">Billing</text>
      <text x="920" y="158" fill="#e8e8ed" font-size="10" text-anchor="middle">charge added</text>
    </g>
  </g>
  <g stroke="#6366f1" stroke-width="1.8" marker-end="url(#a3)">
    <line x1="200" y1="145" x2="236" y2="145"/>
    <line x1="420" y1="145" x2="456" y2="145"/>
    <line x1="640" y1="145" x2="676" y2="145"/>
    <line x1="830" y1="145" x2="856" y2="145"/>
  </g>
  <text x="500" y="40" fill="#98989d" font-size="12" text-anchor="middle">Prescription lifecycle: creation → validation → dispensing → billing</text>
</svg>
