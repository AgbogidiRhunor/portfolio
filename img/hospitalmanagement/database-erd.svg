<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="SF Mono, ui-monospace, monospace">
  <defs>
    <linearGradient id="hdr1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="620" fill="#0c0c0e"/>

  <!-- helper table macro drawn manually for each entity -->
  <!-- Patient -->
  <g>
    <rect x="30" y="30" width="200" height="150" rx="10" fill="#1c1c1e" stroke="#2e2e30"/>
    <rect x="30" y="30" width="200" height="30" rx="10" fill="url(#hdr1)"/>
    <text x="130" y="50" fill="#fff" font-size="13" text-anchor="middle" font-weight="bold">Patient</text>
    <text x="42" y="80" fill="#a1a1a6" font-size="11">PK id</text>
    <text x="42" y="98" fill="#a1a1a6" font-size="11">full_name</text>
    <text x="42" y="116" fill="#a1a1a6" font-size="11">dob</text>
    <text x="42" y="134" fill="#a1a1a6" font-size="11">contact_info</text>
    <text x="42" y="152" fill="#a1a1a6" font-size="11">insurance_id</text>
    <text x="42" y="170" fill="#a1a1a6" font-size="11">user_id (FK)</text>
  </g>

  <!-- Doctor -->
  <g>
    <rect x="30" y="230" width="200" height="130" rx="10" fill="#1c1c1e" stroke="#2e2e30"/>
    <rect x="30" y="230" width="200" height="30" rx="10" fill="url(#hdr1)"/>
    <text x="130" y="250" fill="#fff" font-size="13" text-anchor="middle" font-weight="bold">Doctor</text>
    <text x="42" y="280" fill="#a1a1a6" font-size="11">PK id</text>
    <text x="42" y="298" fill="#a1a1a6" font-size="11">specialty</text>
    <text x="42" y="316" fill="#a1a1a6" font-size="11">license_no</text>
    <text x="42" y="334" fill="#a1a1a6" font-size="11">user_id (FK)</text>
  </g>

  <!-- Appointment -->
  <g>
    <rect x="330" y="30" width="220" height="150" rx="10" fill="#1c1c1e" stroke="#2e2e30"/>
    <rect x="330" y="30" width="220" height="30" rx="10" fill="url(#hdr1)"/>
    <text x="440" y="50" fill="#fff" font-size="13" text-anchor="middle" font-weight="bold">Appointment</text>
    <text x="342" y="80" fill="#a1a1a6" font-size="11">PK id</text>
    <text x="342" y="98" fill="#a1a1a6" font-size="11">patient_id (FK)</text>
    <text x="342" y="116" fill="#a1a1a6" font-size="11">doctor_id (FK)</text>
    <text x="342" y="134" fill="#a1a1a6" font-size="11">scheduled_at</text>
    <text x="342" y="152" fill="#a1a1a6" font-size="11">status</text>
    <text x="342" y="170" fill="#a1a1a6" font-size="11">notes</text>
  </g>

  <!-- MedicalRecord -->
  <g>
    <rect x="330" y="230" width="220" height="150" rx="10" fill="#1c1c1e" stroke="#2e2e30"/>
    <rect x="330" y="230" width="220" height="30" rx="10" fill="url(#hdr1)"/>
    <text x="440" y="250" fill="#fff" font-size="13" text-anchor="middle" font-weight="bold">MedicalRecord</text>
    <text x="342" y="280" fill="#a1a1a6" font-size="11">PK id</text>
    <text x="342" y="298" fill="#a1a1a6" font-size="11">patient_id (FK)</text>
    <text x="342" y="316" fill="#a1a1a6" font-size="11">doctor_id (FK)</text>
    <text x="342" y="334" fill="#a1a1a6" font-size="11">diagnosis</text>
    <text x="342" y="352" fill="#a1a1a6" font-size="11">attachments</text>
    <text x="342" y="370" fill="#a1a1a6" font-size="11">created_at</text>
  </g>

  <!-- Prescription -->
  <g>
    <rect x="630" y="30" width="220" height="150" rx="10" fill="#1c1c1e" stroke="#2e2e30"/>
    <rect x="630" y="30" width="220" height="30" rx="10" fill="url(#hdr1)"/>
    <text x="740" y="50" fill="#fff" font-size="13" text-anchor="middle" font-weight="bold">Prescription</text>
    <text x="642" y="80" fill="#a1a1a6" font-size="11">PK id</text>
    <text x="642" y="98" fill="#a1a1a6" font-size="11">record_id (FK)</text>
    <text x="642" y="116" fill="#a1a1a6" font-size="11">medication</text>
    <text x="642" y="134" fill="#a1a1a6" font-size="11">dosage</text>
    <text x="642" y="152" fill="#a1a1a6" font-size="11">status</text>
    <text x="642" y="170" fill="#a1a1a6" font-size="11">pharmacist_id (FK)</text>
  </g>

  <!-- LabRequest -->
  <g>
    <rect x="630" y="230" width="220" height="150" rx="10" fill="#1c1c1e" stroke="#2e2e30"/>
    <rect x="630" y="230" width="220" height="30" rx="10" fill="url(#hdr1)"/>
    <text x="740" y="250" fill="#fff" font-size="13" text-anchor="middle" font-weight="bold">LabRequest</text>
    <text x="642" y="280" fill="#a1a1a6" font-size="11">PK id</text>
    <text x="642" y="298" fill="#a1a1a6" font-size="11">record_id (FK)</text>
    <text x="642" y="316" fill="#a1a1a6" font-size="11">test_type</text>
    <text x="642" y="334" fill="#a1a1a6" font-size="11">result_file</text>
    <text x="642" y="352" fill="#a1a1a6" font-size="11">lab_staff_id (FK)</text>
    <text x="642" y="370" fill="#a1a1a6" font-size="11">status</text>
  </g>

  <!-- Invoice -->
  <g>
    <rect x="330" y="430" width="220" height="150" rx="10" fill="#1c1c1e" stroke="#2e2e30"/>
    <rect x="330" y="430" width="220" height="30" rx="10" fill="url(#hdr1)"/>
    <text x="440" y="450" fill="#fff" font-size="13" text-anchor="middle" font-weight="bold">Invoice</text>
    <text x="342" y="480" fill="#a1a1a6" font-size="11">PK id</text>
    <text x="342" y="498" fill="#a1a1a6" font-size="11">patient_id (FK)</text>
    <text x="342" y="516" fill="#a1a1a6" font-size="11">accountant_id (FK)</text>
    <text x="342" y="534" fill="#a1a1a6" font-size="11">amount</text>
    <text x="342" y="552" fill="#a1a1a6" font-size="11">paid_status</text>
    <text x="342" y="570" fill="#a1a1a6" font-size="11">issued_at</text>
  </g>

  <!-- User -->
  <g>
    <rect x="30" y="430" width="200" height="130" rx="10" fill="#1c1c1e" stroke="#2e2e30"/>
    <rect x="30" y="430" width="200" height="30" rx="10" fill="url(#hdr1)"/>
    <text x="130" y="450" fill="#fff" font-size="13" text-anchor="middle" font-weight="bold">User</text>
    <text x="42" y="480" fill="#a1a1a6" font-size="11">PK id</text>
    <text x="42" y="498" fill="#a1a1a6" font-size="11">email</text>
    <text x="42" y="516" fill="#a1a1a6" font-size="11">password_hash</text>
    <text x="42" y="534" fill="#a1a1a6" font-size="11">role</text>
  </g>

  <!-- relations -->
  <g stroke="#8b5cf6" stroke-width="1.5" fill="none" opacity="0.7">
    <path d="M230,105 L330,105"/>
    <path d="M230,295 L330,120"/>
    <path d="M550,105 L630,105"/>
    <path d="M550,305 L630,305"/>
    <path d="M440,180 L440,230"/>
    <path d="M230,495 L330,495"/>
    <path d="M130,180 L130,230"/>
    <path d="M130,360 L130,430"/>
  </g>
</svg>
