<svg viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" font-family="SF Mono, ui-monospace, monospace">
  <defs>
    <marker id="a4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#f59e0b"/>
    </marker>
  </defs>
  <rect width="1000" height="420" fill="#0c0c0e"/>

  <g>
    <rect x="20" y="150" width="150" height="70" rx="12" fill="#1c1c1e" stroke="#2e2e30"/>
    <text x="95" y="180" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">Browser</text>
    <text x="95" y="200" fill="#86868b" font-size="10" text-anchor="middle">HTTPS request</text>
  </g>

  <!-- EC2 box containing nginx/gunicorn/django/postgres -->
  <rect x="230" y="60" width="740" height="330" rx="16" fill="none" stroke="#3a3a3c" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="600" y="45" fill="#98989d" font-size="12" text-anchor="middle">AWS EC2 Instance</text>

  <g>
    <rect x="270" y="150" width="150" height="70" rx="12" fill="#1c1c1e" stroke="#f59e0b" stroke-width="1.3"/>
    <text x="345" y="180" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">Nginx</text>
    <text x="345" y="200" fill="#86868b" font-size="10" text-anchor="middle">reverse proxy</text>
  </g>

  <g>
    <rect x="470" y="150" width="150" height="70" rx="12" fill="#1c1c1e" stroke="#2e2e30"/>
    <text x="545" y="180" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">Gunicorn</text>
    <text x="545" y="200" fill="#86868b" font-size="10" text-anchor="middle">WSGI workers</text>
  </g>

  <g>
    <rect x="670" y="150" width="150" height="70" rx="12" fill="#1c1c1e" stroke="#2e2e30"/>
    <text x="745" y="180" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">Django App</text>
    <text x="745" y="200" fill="#86868b" font-size="10" text-anchor="middle">SIWES Logbook</text>
  </g>

  <g>
    <rect x="470" y="290" width="150" height="60" rx="12" fill="#14b8a6" opacity="0.9"/>
    <text x="545" y="325" fill="#04211c" font-size="12" text-anchor="middle" font-weight="bold">PostgreSQL</text>
  </g>

  <g>
    <rect x="270" y="290" width="150" height="60" rx="12" fill="#1c1c1e" stroke="#2e2e30"/>
    <text x="345" y="315" fill="#fff" font-size="11" text-anchor="middle" font-weight="bold">Static Files</text>
    <text x="345" y="333" fill="#86868b" font-size="9" text-anchor="middle">served by Nginx</text>
  </g>

  <g stroke="#f59e0b" stroke-width="1.6" marker-end="url(#a4)">
    <line x1="170" y1="185" x2="266" y2="185"/>
    <line x1="420" y1="185" x2="466" y2="185"/>
    <line x1="620" y1="185" x2="666" y2="185"/>
    <line x1="545" y1="220" x2="545" y2="286"/>
    <line x1="345" y1="220" x2="345" y2="286"/>
  </g>

  <text x="600" y="395" fill="#6e6e73" font-size="10" text-anchor="middle">Unix socket between Nginx and Gunicorn; environment variables manage secrets and DB credentials</text>
</svg>
