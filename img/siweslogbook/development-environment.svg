<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" font-family="SF Mono, ui-monospace, monospace">
  <rect width="700" height="420" fill="#0c0c0e"/>
  <text x="350" y="40" fill="#98989d" font-size="12" text-anchor="middle">Local Development Setup</text>

  <rect x="60" y="80" width="580" height="300" rx="16" fill="none" stroke="#3a3a3c" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="350" y="65" fill="#6e6e73" font-size="10" text-anchor="middle">Developer Machine</text>

  <g>
    <rect x="100" y="120" width="220" height="80" rx="12" fill="#1c1c1e" stroke="#2e2e30"/>
    <text x="210" y="150" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">Django Dev Server</text>
    <text x="210" y="170" fill="#86868b" font-size="10" text-anchor="middle">manage.py runserver</text>
    <text x="210" y="186" fill="#86868b" font-size="10" text-anchor="middle">DEBUG = True</text>
  </g>

  <g>
    <rect x="380" y="120" width="220" height="80" rx="12" fill="#1c1c1e" stroke="#2e2e30"/>
    <text x="490" y="150" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">SQLite</text>
    <text x="490" y="170" fill="#86868b" font-size="10" text-anchor="middle">db.sqlite3 file</text>
    <text x="490" y="186" fill="#86868b" font-size="10" text-anchor="middle">zero-config local DB</text>
  </g>

  <g>
    <rect x="100" y="240" width="220" height="80" rx="12" fill="#1c1c1e" stroke="#2e2e30"/>
    <text x="210" y="270" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">Hot Reload</text>
    <text x="210" y="290" fill="#86868b" font-size="10" text-anchor="middle">auto-restart on file save</text>
  </g>

  <g>
    <rect x="380" y="240" width="220" height="80" rx="12" fill="#1c1c1e" stroke="#2e2e30"/>
    <text x="490" y="270" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">.env (local)</text>
    <text x="490" y="290" fill="#86868b" font-size="10" text-anchor="middle">local secret key, debug flags</text>
  </g>

  <g stroke="#6366f1" stroke-width="1.4" fill="none">
    <line x1="320" y1="160" x2="380" y2="160"/>
    <line x1="210" y1="200" x2="210" y2="240"/>
    <line x1="490" y1="200" x2="490" y2="240"/>
  </g>
</svg>
