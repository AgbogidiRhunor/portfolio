<svg viewBox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg" font-family="SF Mono, ui-monospace, monospace">
  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8b5cf6"/>
    </marker>
  </defs>
  <rect width="1000" height="340" fill="#0c0c0e"/>

  <g font-size="12">
    <rect x="20" y="130" width="150" height="70" rx="12" fill="#1c1c1e" stroke="#2e2e30"/>
    <text x="95" y="160" fill="#fff" text-anchor="middle" font-weight="bold">Login Form</text>
    <text x="95" y="180" fill="#86868b" font-size="10" text-anchor="middle">email + password</text>

    <rect x="210" y="130" width="150" height="70" rx="12" fill="#1c1c1e" stroke="#2e2e30"/>
    <text x="285" y="156" fill="#fff" text-anchor="middle" font-weight="bold">Django Auth</text>
    <text x="285" y="176" fill="#86868b" font-size="10" text-anchor="middle">credential check</text>

    <rect x="400" y="130" width="160" height="70" rx="12" fill="#1c1c1e" stroke="#2e2e30"/>
    <text x="480" y="156" fill="#fff" text-anchor="middle" font-weight="bold">Session Created</text>
    <text x="480" y="176" fill="#86868b" font-size="10" text-anchor="middle">server-side session</text>

    <rect x="600" y="130" width="170" height="70" rx="12" fill="#1c1c1e" stroke="#2e2e30"/>
    <text x="685" y="156" fill="#fff" text-anchor="middle" font-weight="bold">Role Resolver</text>
    <text x="685" y="176" fill="#86868b" font-size="10" text-anchor="middle">attaches permission set</text>

    <rect x="810" y="130" width="170" height="70" rx="12" fill="#6366f1"/>
    <text x="895" y="156" fill="#fff" text-anchor="middle" font-weight="bold">Role Dashboard</text>
    <text x="895" y="176" fill="#e8e8ed" font-size="10" text-anchor="middle">student / supervisor / etc.</text>
  </g>

  <g stroke="#8b5cf6" stroke-width="1.8" marker-end="url(#a1)">
    <line x1="170" y1="165" x2="206" y2="165"/>
    <line x1="360" y1="165" x2="396" y2="165"/>
    <line x1="560" y1="165" x2="596" y2="165"/>
    <line x1="770" y1="165" x2="806" y2="165"/>
  </g>

  <text x="500" y="50" fill="#98989d" font-size="12" text-anchor="middle">Every view checks the active session's role via decorators before rendering role-specific data.</text>

  <rect x="210" y="240" width="150" height="60" rx="12" fill="#1c1c1e" stroke="#2e2e30"/>
  <text x="285" y="265" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">Invalid Credentials</text>
  <text x="285" y="283" fill="#86868b" font-size="9" text-anchor="middle">redirected to login</text>
  <line x1="285" y1="200" x2="285" y2="236" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a1)"/>
</svg>
