<svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg" font-family="SF Mono, ui-monospace, monospace">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="460" fill="#0c0c0e"/>

  <text x="500" y="36" fill="#98989d" font-size="12" text-anchor="middle">Presentation → Django Apps → Service Layer → Database</text>

  <!-- Templates / presentation -->
  <rect x="40" y="70" width="920" height="60" rx="10" fill="#1c1c1e" stroke="#2e2e30"/>
  <text x="60" y="105" fill="#fff" font-size="13" font-weight="bold">Templates &amp; Bootstrap UI</text>
  <text x="500" y="105" fill="#86868b" font-size="10" text-anchor="middle">role-conditional rendering, forms, dashboards</text>

  <!-- Django apps row -->
  <g font-size="11">
    <rect x="40" y="160" width="210" height="90" rx="10" fill="#1c1c1e" stroke="url(#hdr)" stroke-width="1.3"/>
    <text x="145" y="185" fill="#fff" text-anchor="middle" font-weight="bold">accounts</text>
    <text x="56" y="205" fill="#86868b">User, Role, Profile</text>
    <text x="56" y="221" fill="#86868b">auth views &amp; permissions</text>
    <text x="56" y="237" fill="#86868b">middleware checks</text>

    <rect x="270" y="160" width="210" height="90" rx="10" fill="#1c1c1e" stroke="url(#hdr)" stroke-width="1.3"/>
    <text x="375" y="185" fill="#fff" text-anchor="middle" font-weight="bold">logbook</text>
    <text x="286" y="205" fill="#86868b">Entry, WeeklyReport</text>
    <text x="286" y="221" fill="#86868b">submission &amp; approval</text>
    <text x="286" y="237" fill="#86868b">state machine logic</text>

    <rect x="500" y="160" width="210" height="90" rx="10" fill="#1c1c1e" stroke="url(#hdr)" stroke-width="1.3"/>
    <text x="605" y="185" fill="#fff" text-anchor="middle" font-weight="bold">evaluations</text>
    <text x="516" y="205" fill="#86868b">Rubric, Score, Grade</text>
    <text x="516" y="221" fill="#86868b">lecturer scoring forms</text>
    <text x="516" y="237" fill="#86868b">grade computation</text>

    <rect x="730" y="160" width="230" height="90" rx="10" fill="#1c1c1e" stroke="url(#hdr)" stroke-width="1.3"/>
    <text x="845" y="185" fill="#fff" text-anchor="middle" font-weight="bold">reports</text>
    <text x="746" y="205" fill="#86868b">Placement, Institution</text>
    <text x="746" y="221" fill="#86868b">coordinator analytics</text>
    <text x="746" y="237" fill="#86868b">export &amp; aggregation</text>
  </g>

  <!-- Service layer -->
  <rect x="40" y="280" width="920" height="60" rx="10" fill="#1c1c1e" stroke="#2e2e30"/>
  <text x="60" y="315" fill="#fff" font-size="13" font-weight="bold">Service Layer</text>
  <text x="500" y="315" fill="#86868b" font-size="10" text-anchor="middle">workflow transitions, validation, cross-app business logic</text>

  <!-- DB -->
  <rect x="330" y="370" width="340" height="60" rx="10" fill="#14b8a6" opacity="0.9"/>
  <text x="500" y="405" fill="#04211c" font-size="13" text-anchor="middle" font-weight="bold">PostgreSQL</text>

  <!-- connecting lines -->
  <g stroke="#3a3a3c" stroke-width="1.3" fill="none">
    <line x1="500" y1="130" x2="500" y2="160"/>
    <line x1="145" y1="250" x2="145" y2="280"/>
    <line x1="375" y1="250" x2="375" y2="280"/>
    <line x1="605" y1="250" x2="605" y2="280"/>
    <line x1="845" y1="250" x2="845" y2="280"/>
    <line x1="500" y1="340" x2="500" y2="370"/>
  </g>
</svg>
