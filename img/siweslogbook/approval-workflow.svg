<svg viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" font-family="SF Mono, ui-monospace, monospace">
  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#14b8a6"/>
    </marker>
  </defs>
  <rect width="1000" height="300" fill="#0c0c0e"/>
  <g font-size="12">
    <g>
      <rect x="20" y="110" width="200" height="70" rx="12" fill="#1c1c1e" stroke="#2e2e30"/>
      <text x="120" y="140" fill="#fff" text-anchor="middle" font-weight="bold">Student</text>
      <text x="120" y="160" fill="#86868b" font-size="10" text-anchor="middle">submits logbook entry</text>
    </g>
    <g>
      <rect x="260" y="110" width="200" height="70" rx="12" fill="#1c1c1e" stroke="#2e2e30"/>
      <text x="360" y="140" fill="#fff" text-anchor="middle" font-weight="bold">Industrial Supervisor</text>
      <text x="360" y="160" fill="#86868b" font-size="10" text-anchor="middle">reviews &amp; comments</text>
    </g>
    <g>
      <rect x="500" y="110" width="200" height="70" rx="12" fill="#1c1c1e" stroke="#2e2e30"/>
      <text x="600" y="140" fill="#fff" text-anchor="middle" font-weight="bold">Lecturer</text>
      <text x="600" y="160" fill="#86868b" font-size="10" text-anchor="middle">approves &amp; evaluates</text>
    </g>
    <g>
      <rect x="740" y="110" width="240" height="70" rx="12" fill="#14b8a6"/>
      <text x="860" y="140" fill="#04211c" text-anchor="middle" font-weight="bold">School Coordinator</text>
      <text x="860" y="160" fill="#04211c" font-size="10" text-anchor="middle">finalizes record</text>
    </g>
  </g>
  <g stroke="#14b8a6" stroke-width="1.8" marker-end="url(#a2)">
    <line x1="220" y1="145" x2="256" y2="145"/>
    <line x1="460" y1="145" x2="496" y2="145"/>
    <line x1="700" y1="145" x2="736" y2="145"/>
  </g>
  <text x="500" y="40" fill="#98989d" font-size="12" text-anchor="middle">Configurable approval chain — invalid state transitions are rejected by the service layer</text>
  <text x="500" y="230" fill="#6e6e73" font-size="10" text-anchor="middle" font-family="SF Mono, ui-monospace, monospace">status: draft → submitted → supervisor_reviewed → lecturer_approved → finalized</text>
</svg>
