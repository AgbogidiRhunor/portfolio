    <path d="M230,285 L290,120"/>
    <path d="M510,105 L570,105"/>
    <path d="M510,295 L570,295"/>
    <path d="M400,180 L400,230"/>
    <path d="M400,340 L400,410"/>
    <path d="M230,465 L290,485"/>
    <path d="M130,180 L130,230"/>
    <path d="M130,340 L130,410"/>
    <path d="M680,180 L680,230"/>
    <path d="M510,485 L570,470"/>
